<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | Arcana English</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="article-header"
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <a href="/" id="home-link" style="text-decoration: none; color: inherit;">
                <h1 style="margin: 0; font-size: 1.8rem;">Super Knowledge</h1>
            </a>
            <div id="lang-switcher" class="lang-switcher"></div>
        </header>

        <!-- Article content will be injected here -->
        <main id="app" class="fade-in">
            <div class="loading"></div>
        </main>

        <!-- Glossary Section -->
        <section id="glossary" class="glossary-section" style="display: none;">
            <h2>Glossary</h2>
            <div id="glossary-list" class="glossary-grid">
                <!-- Glossary items injected here -->
            </div>
        </section>
    </div>

    <!-- Modal for Sentence Study -->
    <div id="study-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="btn-play-corner" id="modal-play-pause">
                <span class="icon">▶</span> Play
            </button>

            <button class="btn-auto-toggle" id="modal-auto-toggle" onclick="toggleAutoMode()">
                Auto Mode: OFF
            </button>

            <button class="btn-repeat-toggle" id="modal-repeat-toggle" onclick="toggleRepeatMode()">
                Repeat: 1x
            </button>

            <button class="modal-close" onclick="closeModal()">×</button>

            <div class="modal-section-en">
                <div class="modal-text-en" id="modal-english"></div>
            </div>

            <div class="modal-info-area">
                <div id="modal-info-content" class="info-content">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>
        <div class="modal-nav nav-prev" onclick="prevSentence()">‹</div>
        <div class="modal-nav nav-next" onclick="nextSentence()">›</div>
    </div>

    <script type="module" src="/js/article-loader.js"></script>
</body>

</html>
