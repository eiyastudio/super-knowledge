<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | Arcana English</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container fade-in">
        <nav style="margin-bottom: 2rem;">
            <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 700;">← Back to
                Index</a>
        </nav>

        <main id="app">
            <div class="loading">Loading article...</div>
        </main>

        <section id="glossary" class="glossary" style="display: none;">
            <h3>Glossary</h3>
            <div id="glossary-list"></div>
        </section>
    </div>

    <!-- Sentential Study Modal -->
    <div id="study-modal" class="modal-overlay" style="display: none;">
        <button class="modal-close" onclick="closeModal()">×</button>
        <div class="modal-nav nav-prev" onclick="prevSentence()">‹</div>
        <div class="modal-content">
            <div class="modal-section-en">
                <div id="modal-english" class="modal-text-en" onclick="resetToTranslation()"></div>
            </div>

            <div class="modal-controls">
                <button id="modal-play-pause" class="btn-play-large">
                    <span class="icon">▶</span> Play
                </button>
            </div>

            <div class="modal-info-area">
                <div id="modal-info-content" class="info-content">
                    <!-- Toggles between translation and glossary -->
                </div>
            </div>
        </div>
        <div class="modal-nav nav-next" onclick="nextSentence()">›</div>
    </div>

    <script type="module" src="js/article-loader.js"></script>
</body>

</html>
